name: Android app

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Capacitor and sync Android project
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Publish APK to the website
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          mkdir -p public/downloads
          cp "$APK" public/downloads/scg-crm.apk
          SIZE=$(stat -c %s public/downloads/scg-crm.apk)
          PUSH=$([ -f mobile/android/app/google-services.json ] && echo true || echo false)
          printf '{"version":"1.0.%s","build":%s,"size":%s,"push":%s,"built_at":"%s"}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" "$SIZE" "$PUSH" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > public/downloads/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads
          git commit -m "Android build 1.0.${{ github.run_number }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Save build log on failure
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/gradle.log" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rfq --cached . >/dev/null
          tail -n 400 "$RUNNER_TEMP/gradle.log" > gradle-tail.log
          grep -n -E "error|FAILURE|What went wrong|Exception" "$RUNNER_TEMP/gradle.log" | head -100 > gradle-errors.log || true
          git add gradle-tail.log gradle-errors.log
          git commit -qm "Build log for run ${{ github.run_number }}"
          git push -f origin ci-logs

      - uses: actions/upload-artifact@v5
        with:
          name: scg-crm-1.0.${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
