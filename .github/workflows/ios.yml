name: iOS app

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    # Xcode only runs on Apple hardware — this is the one thing that has to
    # differ from the Android workflow, which builds fine on ubuntu-latest.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS deps
        working-directory: mobile
        run: npm ci

      # The iOS project isn't committed yet (it has to be generated on a
      # machine with real network access — this sandbox-built repo couldn't
      # run `cap add ios` itself). First run here creates it, regenerates the
      # icon/splash assets from mobile/resources/, and commits the result so
      # every run after this one just syncs an already-stable project,
      # exactly like the Android workflow does with mobile/android.
      - name: Add the iOS project (first run only)
        working-directory: mobile
        run: |
          if [ -d ios/App ]; then
            echo "ios/App already exists — skipping scaffold."
            exit 0
          fi
          npm install @capacitor/ios@^8.6.0
          npx cap add ios
          npx @capacitor/assets@latest generate --ios \
            --iconBackgroundColor '#2563eb' --iconBackgroundColorDark '#0b1220' \
            --splashBackgroundColor '#070b12' --splashBackgroundColorDark '#070b12'

      - name: Sync web assets into the iOS project
        working-directory: mobile
        run: npx cap sync ios

      - name: Commit a freshly generated iOS project
        working-directory: mobile
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add generated iOS project (mobile/ios) + icon/splash assets"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios/App
        run: pod install

      # Builds for the Simulator, which needs no signing at all — this is the
      # useful part before the Apple Developer account exists: it proves the
      # generated project actually compiles. It does NOT produce anything
      # installable on a real device; that needs the signed step below.
      - name: Smoke build for the iOS Simulator (no signing required)
        working-directory: mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-sim.log"

      # ---- Everything below needs the paid Apple Developer Program account ----
      # and is untested until real credentials exist to try it against. Add
      # these repository secrets once the account is set up, from App Store
      # Connect → Users and Access → Integrations → App Store Connect API:
      #   APPLE_TEAM_ID                    (Developer portal → Membership)
      #   APP_STORE_CONNECT_KEY_ID         (the API key's Key ID)
      #   APP_STORE_CONNECT_ISSUER_ID      (the API key's Issuer ID)
      #   APP_STORE_CONNECT_KEY_P8_BASE64  (the downloaded .p8 private key, base64-encoded)
      - name: Check for Apple signing secrets
        id: apple_secrets
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY_P8" ]; then
            echo "::notice::Apple signing secrets aren't set yet (APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_P8_BASE64). Stopping after the Simulator smoke build — that part passing confirms the project itself is sound."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Load App Store Connect API key
        if: steps.apple_secrets.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_P8_B64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Archive and sign (automatic signing via App Store Connect API key)
        if: steps.apple_secrets.outputs.ready == 'true'
        working-directory: mobile/ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace -scheme App -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive 2>&1 | tee "$RUNNER_TEMP/xcodebuild-archive.log"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-export.log"

      - name: Upload to TestFlight
        if: steps.apple_secrets.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/App.ipa" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Save build logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ios-build-logs
          path: ${{ runner.temp }}/xcodebuild-*.log
          if-no-files-found: ignore
