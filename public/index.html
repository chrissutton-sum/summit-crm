<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Summit Creative Group | CRM</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#070b12;--panel:#101726;--card:#162033;--inp:#0b101b;--blue:#2563eb;--cyan:#38bdf8;--gold:#f59e0b;--tx:#f1f5f9;--mut:#94a3b8;--bd:#283754;--ok:#10b981;--bad:#ef4444}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:var(--bg);color:var(--tx);padding-bottom:80px;min-height:100vh}
header{background:var(--panel);border-bottom:2px solid var(--blue);padding:10px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:1rem;text-transform:uppercase;letter-spacing:.8px}h1 small{display:block;font-size:.62rem;color:var(--cyan)}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.t{font-weight:700}.s{font-size:.8rem;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}.kpi b{display:block;font-size:1.3rem;color:var(--cyan);margin-top:4px}
.bar{background:var(--bg);height:9px;border-radius:5px;overflow:hidden;margin:3px 0 9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}.bar i.g{background:var(--ok)}.bar i.y{background:var(--gold)}
button,.btn{background:var(--blue);color:#fff;border:1px solid var(--cyan);padding:6px 11px;border-radius:7px;font-size:.78rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.b2{background:var(--card);border-color:var(--bd)}.bg{background:#b45309;border-color:#fbbf24}.bd{background:rgba(239,68,68,.15);border-color:var(--bad);color:#fca5a5}
button:disabled{opacity:.3}
input,select,textarea{width:100%;padding:8px 10px;margin-bottom:9px;background:var(--inp);border:1px solid var(--bd);border-radius:7px;color:var(--tx);font-size:.9rem}
label{display:block;font-size:.7rem;text-transform:uppercase;color:var(--mut);margin-bottom:3px;font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
.pill{font-size:.68rem;background:var(--bg);color:var(--cyan);border:1px solid var(--bd);padding:2px 7px;border-radius:4px;margin:2px 2px 0 0;display:inline-block}
.badge{font-size:.68rem;padding:3px 8px;border-radius:6px;font-weight:700;border:1px solid var(--blue);background:rgba(37,99,235,.25);color:#93c5fd}.badge.r{border-color:var(--bad);background:rgba(239,68,68,.2);color:#fca5a5}.badge.o{border-color:var(--ok);background:rgba(16,185,129,.2);color:#6ee7b7}
.folders{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:640px){.folders{grid-template-columns:repeat(3,1fr)}}
.folder{cursor:pointer}.folder:active{opacity:.75}.folder .t{font-size:.95rem}
.kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px}
.col{min-width:270px;max-width:270px;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:10px}.col.over{border:2px dashed var(--cyan)}
.col h3{font-size:.8rem;text-transform:uppercase;color:var(--cyan);display:flex;justify-content:space-between;margin-bottom:8px}
.kc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--bd);display:flex;padding:5px 2px calc(5px + env(safe-area-inset-bottom,0px));z-index:50}
nav{overflow-x:auto}nav div{flex:1 0 58px;text-align:center;font-size:.62rem;color:var(--mut);cursor:pointer;padding:4px 0;border-radius:6px}nav div.on{color:var(--cyan);background:rgba(56,189,248,.1)}nav span{display:block;font-size:1.1rem}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;overflow-y:auto;padding:14px}
#mbox{background:var(--panel);border:1px solid var(--cyan);border-radius:12px;max-width:580px;margin:10px auto;padding:16px}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--inp);padding:9px;border-radius:7px;margin-bottom:9px;border:1px solid var(--bd)}.chk label{display:flex;gap:6px;align-items:center;text-transform:none;font-weight:400;font-size:.82rem;color:var(--tx);margin:0}.chk input{width:auto;margin:0}
.li{display:grid;grid-template-columns:24px 1fr 90px;gap:8px;align-items:center;margin-bottom:6px;font-size:.85rem}.li input{margin:0}
@media print{body>*:not(#modal){display:none!important}#modal{position:static;background:#fff;padding:0}#mbox{border:0;background:#fff;color:#000;max-width:100%}#mbox *{color:#000!important;background:#fff!important;border-color:#999!important}.np{display:none!important}}
</style></head><body>
<div id="loginScreen" style="display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px">
 <div style="width:100%;max-width:340px">
  <h1 style="text-align:center;margin-bottom:4px">Summit Creative<small style="display:block;text-align:center;font-size:.62rem;color:var(--cyan);margin-top:4px">Command CRM • Boise, ID</small></h1>
  <div class="card" style="margin-top:20px">
   <label>Username</label><input id="loginUser" autocomplete="username" autocapitalize="off">
   <label>Password</label><input id="loginPass" type="password" autocomplete="current-password">
   <div id="loginErr" class="s" style="color:var(--bad);margin-bottom:9px;min-height:1em"></div>
   <button id="loginBtn" style="width:100%">Sign in</button>
  </div>
 </div>
</div>
<div id="app" style="display:none">
<header><h1>Summit Creative<small>Command CRM • Boise, ID</small></h1>
<div style="display:flex;gap:6px;align-items:center"><span id="sync" class="s"></span><select id="who" style="width:auto;margin:0;max-width:150px"></select><button class="b2" data-a="search">🔍</button><button class="b2" data-a="alerts" id="bell">🔔 0</button><button class="b2" data-a="logout">⎋</button></div></header>
<div class="wrap" id="main"></div>
<nav id="nav"></nav>
<div id="modal"><div id="mbox"></div></div>
</div>
<script>
/* ===== Data & storage: shared via db capability, falls back to localStorage ===== */
const KEY='summit_crm_v4', uid=()=>Math.random().toString(36).slice(2,10), $=n=>'$'+Math.round(n||0).toLocaleString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SRV=['SEO','AEO','GEO','CTV','Social Media','Podcasts','Logo Design','Live Events'];
const DEF=()=>({users:[{id:'u1',name:'Alex',role:'Managing Partner'},{id:'u2',name:'Sarah',role:'Account Executive'},{id:'u3',name:'Jordan',role:'Events & Media'}],
 cfg:{rates:{SEO:1200,AEO:850,GEO:850,CTV:2200,'Social Media':950,Podcasts:900,'Logo Design':750,'Live Events':2500},
  stages:['Qualification','Audit & Discovery','Proposal / Pitch','Negotiation','Closed Won','Closed Lost'],
  disps:['New Lead','Attempted Contact','Contacted','Discovery Scheduled','Proposal Sent','Converted','Lost'],
  onboard:['Signed retainer & deposit collected','Kickoff & strategy call scheduled','Website, GBP & analytics access granted','Logo & brand assets uploaded','30-day launch roadmap delivered']},
 leads:[],deals:[],acts:[],accts:[],invoices:[],recur:[],log:[],audit:[],deliv:[],props:[],tasks:[],files:[],templates:[
 {id:'t1',name:'Intro follow-up',subject:'Great connecting, {{contact}}',body:`Hi {{contact}},

Thanks for taking the time to talk about {{client}}. I'd love to share how Summit Creative can help grow your visibility in the Treasure Valley. Would a quick call this week work?

{{rep}}
Summit Creative Group`},
 {id:'t2',name:'Proposal sent',subject:'Your Summit Creative proposal',body:`Hi {{contact}},

Attached is the proposal for {{client}}. Happy to walk through it and adjust the scope. What day works for a short review?

{{rep}}
Summit Creative Group`},
 {id:'t3',name:'Invoice due',subject:'Invoice {{invoice}} from Summit Creative',body:`Hi {{contact}},

Your invoice {{invoice}} for {{amount}} is due {{due}}. Please let me know if you have any questions.

Thank you,
{{rep}}
Summit Creative Group`},
 {id:'t4',name:'Overdue notice',subject:'Reminder: invoice {{invoice}} is past due',body:`Hi {{contact}},

A friendly reminder that invoice {{invoice}} ({{amount}}) was due {{due}} and is still open. If it has already been sent, thank you and please disregard.

{{rep}}
Summit Creative Group`},
 {id:'t5',name:'Welcome / onboarding',subject:'Welcome to Summit Creative, {{client}}!',body:`Hi {{contact}},

Welcome aboard! We're excited to get started. Here is where your onboarding stands:

{{extra}}

{{rep}}
Summit Creative Group`},
 {id:'t6',name:'Monthly update',subject:'Your monthly update from Summit Creative',body:`Hi {{contact}},

Here is your monthly snapshot for {{client}}:

{{extra}}

{{rep}}
Summit Creative Group`}]});
let S=DEF(), tab='dash', dl=null, dealMode='kan', dragId=null, lastLocal=0, leadFolder=null, leadPage=0, clientPage=0;
const PAGESZ=10;
// Slices items into one page of PAGESZ, clamping the current page in place, and
// returns {items, page, pages} so the caller can render a page of cards plus
// Previous/Next controls at the bottom. setPage lets Next/Previous mutate the
// right state var (leadPage or clientPage) without duplicating this logic.
function paginate(items,page){const pages=Math.max(1,Math.ceil(items.length/PAGESZ));if(page>=pages)page=pages-1;if(page<0)page=0;return{items:items.slice(page*PAGESZ,page*PAGESZ+PAGESZ),page,pages}}
function pager(page,pages,action){return pages<=1?'':`<div class="row" style="justify-content:center;gap:12px;margin:14px 0 4px"><button class="b2" ${page<=0?'disabled':''} data-a="${action}" data-id="-1">◀ Previous</button><span class="s" style="align-self:center">Page ${page+1} of ${pages}</span><button class="b2" ${page>=pages-1?'disabled':''} data-a="${action}" data-id="1">Next ▶</button></div>`}
const KEYS=['users','cfg','leads','deals','acts','accts','invoices','recur','templates','log','audit','deliv','props','tasks','files'];
const el=id=>document.getElementById(id);
function merge(d){KEYS.forEach(k=>{if(d[k]!==undefined)S[k]=d[k]})}

/* ===== Auth + REST persistence (replaces the old claude.ai db capability) ===== */
let TOKEN=null,MYID=null,MYNAME=null,IS_ADMIN=false;
const api=async(path,opts={})=>{const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{}),...(opts.headers||{})}});
 if(r.status===401){doLogout();throw new Error('Session expired')}return r};
function doLogout(){TOKEN=null;try{localStorage.removeItem('summit_token')}catch(e){}el('app').style.display='none';el('loginScreen').style.display='flex';el('loginPass').value=''}
async function doLogin(){const u=el('loginUser').value.trim(),p=el('loginPass').value;el('loginErr').textContent='';
 if(!u||!p){el('loginErr').textContent='Enter a username and password.';return}
 try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
  const d=await r.json();if(!r.ok){el('loginErr').textContent=d.error||'Could not sign in.';return}
  TOKEN=d.token;MYID=d.userId;IS_ADMIN=d.isAdmin;try{localStorage.setItem('summit_token',TOKEN)}catch(e){}
  await boot()}catch(e){el('loginErr').textContent='Could not reach the server.'}}
function save(...ks){lastLocal=Date.now();render();pushData()}
async function pushData(){try{await api('/api/data',{method:'PUT',body:JSON.stringify(S)});el('sync').textContent='● shared'}catch(e){if(TOKEN)el('sync').textContent='⚠ save failed'}}
async function pullData(quiet){try{const r=await api('/api/data');const d=await r.json();if(Date.now()-lastLocal<4000)return;
 // Don't yank the rug out from under someone mid-type: a background sync used to
 // re-render the whole screen every 10s regardless, which wiped out any text typed
 // into a field (e.g. Settings → "+ Add user") that hadn't been saved yet. If the
 // person is focused in a text field, hold this sync until they're done.
 const a=document.activeElement,tag=a&&a.tagName;if(tag==='INPUT'||tag==='TEXTAREA')return;
 merge(d);el('sync').textContent='● shared';if(!quiet)render()}catch(e){}}
async function boot(){
 el('loginScreen').style.display='none';el('app').style.display='block';
 MYNAME=(JSON.parse(atob(TOKEN.split('.')[1]))||{}).username||'';
 await pullData(true);
 init();
 setInterval(()=>pullData(false),10000);
}
(async()=>{
 try{TOKEN=localStorage.getItem('summit_token')}catch(e){}
 if(TOKEN){try{const payload=JSON.parse(atob(TOKEN.split('.')[1]));
   if(payload.exp&&payload.exp*1000<Date.now())throw new Error('expired');
   MYID=payload.userId;IS_ADMIN=payload.isAdmin;await boot()}catch(e){doLogout()}}
 else{el('loginScreen').style.display='flex'}
 el('loginBtn').onclick=doLogin;
 el('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
})();
/* ===== Helpers ===== */
const uName=id=>(S.users.find(u=>u.id===id)||{name:'Unassigned'}).name;
const rate=s=>Number(S.cfg.rates[s])||800, sum=a=>(a||[]).reduce((t,s)=>t+rate(s),0);
const WON=()=>S.cfg.stages[S.cfg.stages.length-2], LOST=()=>S.cfg.stages[S.cfg.stages.length-1];
const isOpen=d=>d.stage!==WON()&&d.stage!==LOST();
const prob=st=>{const i=S.cfg.stages.indexOf(st),n=S.cfg.stages.length;return st===WON()?100:st===LOST()?0:Math.round(10+(i/(n-2))*80)};
const mine=o=>el('who').value==='ALL'||o.owner===el('who').value;
const optU=(sel)=>S.users.map(u=>`<option value="${u.id}" ${u.id===sel?'selected':''}>${esc(u.name)}</option>`).join('');
const optL=(a,sel)=>a.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
const bar=(l,v,max,c='')=>`<div class="row s" style="color:var(--tx)"><span>${l}</span><b style="color:var(--cyan)">${v}</b></div><div class="bar"><i class="${c}" style="width:${max?Math.max(v&&6,Math.min(100,v/max*100)):0}%"></i></div>`;
const dueNow=a=>!a.done&&new Date(a.dt)<=new Date();
/* ===== Generic form modal ===== */
function openModal(h){el('mbox').innerHTML=h;el('modal').style.display='block'}
function closeM(){el('modal').style.display='none'}
function form(title,fields,v,onSave){
 let h=`<h3 style="margin-bottom:12px">${esc(title)}</h3>`;
 fields.forEach(f=>{const val=v[f.k]??'';h+=`<label>${esc(f.l)}</label>`;
  if(f.t==='sel')h+=`<select id="f_${f.k}">${f.o.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return`<option value="${esc(a)}" ${a===val?'selected':''}>${esc(b)}</option>`}).join('')}</select>`;
  else if(f.t==='area')h+=`<textarea id="f_${f.k}" rows="3">${esc(val)}</textarea>`;
  else if(f.t==='srv')h+=`<div class="chk" id="f_${f.k}">${SRV.map(s=>`<label><input type="checkbox" value="${esc(s)}" ${(val||[]).includes(s)?'checked':''}>${esc(s)} (${$$(rate(s))})</label>`).join('')}</div>`;
  else h+=`<input id="f_${f.k}" type="${f.t||'text'}" value="${esc(val)}" placeholder="${esc(f.p||'')}">`});
 h+=`<div class="row"><button id="fsave" style="flex:1">Save</button><button class="b2" data-a="close">Cancel</button></div>`;
 openModal(h);
 el('fsave').onclick=()=>{const o={};fields.forEach(f=>{const e=el('f_'+f.k);o[f.k]=f.t==='srv'?[...e.querySelectorAll('input:checked')].map(i=>i.value):f.t==='number'?Number(e.value)||0:e.value.trim()});{const lbl=title+': '+(o.company||o.name||o.title||o.client||'');if(onSave(o)!==false){aud(lbl);save('audit');closeM()}}}}
const $$=n=>Math.round(n).toLocaleString();
/* ===== Views ===== */
const TABS=[['dash','📊','Analytics'],['leads','🎯','Leads'],['deals','💼','Deals'],['cal','📅','Calendar'],['tasks','✅','Tasks'],['clients','🚀','Clients'],['inv','🧾','Invoices'],['ins','📈','Insights'],['set','⚙️','Settings']];
function init(){el('nav').innerHTML=TABS.map(t=>`<div data-a="tab" data-id="${t[0]}"><span>${t[1]}</span>${t[2]}</div>`).join('');render();runRecurring()}
function render(){if(typeof slackNotify==='function')A.flagOverdue&&A.flagOverdue();
 const w=el('who'),cur=w.value||'ALL';w.innerHTML=`<option value="ALL">👥 All users</option>`+S.users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('');w.value=S.users.some(u=>u.id===cur)?cur:'ALL';
 if(hidden(tab))tab='dash';el('nav').innerHTML=TABS.filter(t=>!hidden(t[0])).map(t=>`<div class="${t[0]===tab?'on':''}" data-a="tab" data-id="${t[0]}"><span>${t[1]}</span>${t[2]}</div>`).join('');
 el('bell').textContent='🔔 '+S.acts.filter(a=>dueNow(a)&&a.pri==='High').length;
 const v={dash:vDash,leads:vLeads,deals:vDeals,cal:vCal,clients:vClients,inv:vInv,set:vSet,tasks:vTasks,ins:vIns}[tab];el('main').innerHTML=v()}
function vDash(){
 const D=S.deals.filter(mine),open=D.filter(isOpen),pipe=open.reduce((t,d)=>t+d.amount,0),wtd=open.reduce((t,d)=>t+d.amount*prob(d.stage)/100,0);
 const won=D.filter(d=>d.stage===WON()).reduce((t,d)=>t+d.amount,0),A=S.acts.filter(a=>!a.done&&mine(a)),od=A.filter(dueNow).length;
 const stMax=Math.max(1,...S.cfg.stages.map(s=>D.filter(d=>d.stage===s).reduce((t,d)=>t+d.amount,0)));
 const cnt={};[...S.leads.filter(mine),...D].forEach(x=>(x.services||[]).forEach(s=>cnt[s]=(cnt[s]||0)+1));const cm=Math.max(1,...Object.values(cnt));
 const uv=S.users.map(u=>({u,v:S.deals.filter(d=>d.owner===u.id&&isOpen(d)).reduce((t,d)=>t+d.amount,0)})),um=Math.max(1,...uv.map(x=>x.v));
 const unpaid=S.invoices.filter(i=>!i.paid).reduce((t,i)=>t+i.amount,0);
 return`<div class="row" style="margin-bottom:12px"><h2>Executive Command</h2><div><button data-a="newLead">+ Lead</button> <button class="bg" data-a="prop" data-id="blank">📄 Blank Quote</button></div></div>
 <div class="kpis"><div class="kpi">Open Pipeline<b>${$(pipe)}</b></div><div class="kpi">Weighted<b>${$(wtd)}</b></div><div class="kpi">Won<b style="color:var(--ok)">${$(won)}</b></div><div class="kpi">Open Tasks<b style="color:var(--gold)">${A.length}${od?` <small style="color:#f87171">(${od} due)</small>`:''}</b></div></div>
 <div class="g2"><div class="card"><div class="t">Pipeline by Stage</div>${S.cfg.stages.map(s=>{const l=D.filter(d=>d.stage===s);return bar(`${esc(s)} (${l.length})`,$(l.reduce((t,d)=>t+d.amount,0)),1,s===WON()?'g':s===LOST()?'y':'').replace(/width:[^"]*/,`width:${Math.max(l.length?6:0,l.reduce((t,d)=>t+d.amount,0)/stMax*100)}%`)}).join('')}</div>
 <div class="card"><div class="t">Service Demand</div>${Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([s,c])=>bar(esc(s),c,cm)).join('')||'<p class="s">Tag services on leads or deals.</p>'}</div></div>
 <div class="card"><div class="t">Team Leaderboard</div>${uv.map(x=>bar(`${esc(x.u.name)} <span class="s">${esc(x.u.role)}</span>`,$(x.v),1,'y').replace(/width:[^"]*/,`width:${Math.max(x.v?5:0,x.v/um*100)}%`)).join('')}<div class="s">Unpaid invoices: <b style="color:var(--gold)">${$(unpaid)}</b></div></div>`}
function vLeads(){
 const q=(window._lq||'').toLowerCase(),mineLeads=S.leads.filter(mine);
 const head=`<div class="row" style="margin-bottom:10px"><h2>Leads</h2><div><button class="b2" data-a="csv" data-id="leads">⬇ CSV</button> <button data-a="newLead">+ New Lead</button></div></div>
 <input placeholder="Search…" value="${esc(window._lq||'')}" data-c="lq">`;
 // No search in progress and no folder open: show one folder per lead status
 // instead of every lead at once, so a long pipeline doesn't crowd the screen.
 if(!q&&!leadFolder){
  const buckets=S.cfg.disps.slice();
  const extra=[...new Set(mineLeads.map(l=>l.disposition).filter(d=>!buckets.includes(d)))];
  return head+`<div class="folders">`+buckets.concat(extra).map(st=>{const n=mineLeads.filter(l=>l.disposition===st).length;
   return`<div class="card folder" data-a="openLeadFolder" data-id="${esc(st)}"><div class="t">📁 ${esc(st)}</div><div class="s">${n} lead${n===1?'':'s'}</div></div>`}).join('')+`</div>`
   +(mineLeads.length?'':'<div class="card s" style="margin-top:12px">No leads yet.</div>')}
 const L=mineLeads.filter(l=>q?(l.company+l.contact+l.services.join()).toLowerCase().includes(q):l.disposition===leadFolder);
 const backBtn=!q?`<button class="b2" data-a="leadFolderBack">← All folders</button>`:'';

 impRun(){const{type,R}=IMPD,m={};IF[type].forEach(([k])=>m[k]=el('im_'+k).value);const get=(r,k)=>m[k]===''?'':String(r[m[k]]??'').trim(),mode=el('imd').value,defO=el('imo').value,batch=uid();let add=0,upd=0,skip=0;
  const owner=r=>{const n=get(r,'owner').toLowerCase();return(n&&S.users.find(u=>u.name.toLowerCase()===n||n.startsWith(u.name.toLowerCase())||u.name.toLowerCase().startsWith(n)))?.id||defO};
  const svc=r=>get(r,'services').split(/[;,|]/).map(x=>x.trim().toLowerCase()).map(x=>SRV.find(v=>v.toLowerCase()===x)).filter(Boolean);
  const src=r=>{const x=get(r,'source').toLowerCase();return SOURCES.find(v=>v.toLowerCase()===x)||SOURCES.find(v=>x&&(v.toLowerCase().includes(x)||x.includes(v.toLowerCase().split(' ')[0])))||'Unknown'};
  const low=x=>String(x||'').toLowerCase();
  R.forEach(r=>{let o,ex;
   if(type==='leads'){const c=get(r,'company')||get(r,'contact');if(!c){skip++;return}const sv=svc(r),dsp=get(r,'disposition');o={company:c,contact:get(r,'contact'),phone:get(r,'phone'),email:get(r,'email'),source:src(r),disposition:S.cfg.disps.find(d=>low(d)===low(dsp))||S.cfg.disps[0],value:num(get(r,'value'))||sum(sv),services:sv,notes:get(r,'notes'),owner:owner(r)};
    ex=S.leads.find(l=>(o.email&&low(l.email)===low(o.email))||(low(l.company)===low(o.company)&&low(l.contact)===low(o.contact)));
    if(!ex||mode==='add'){S.leads.unshift({id:uid(),imp:batch,...o});add++}else if(mode==='update'){Object.entries(o).forEach(([k,v])=>{if(v!==''&&!(Array.isArray(v)&&!v.length)&&v!==0)ex[k]=v});upd++}else skip++}
   if(type==='deals'){const nm=get(r,'name')||get(r,'account');if(!nm){skip++;return}const sv=svc(r),st=get(r,'stage'),ls=low(st);const stage=S.cfg.stages.find(x=>low(x)===ls)||(/won/.test(ls)?WON():/lost/.test(ls)?LOST():S.cfg.stages[0]);
    o={name:nm,account:get(r,'account')||nm,email:get(r,'email'),stage,amount:num(get(r,'amount'))||sum(sv),close:dt(get(r,'close')),source:src(r),services:sv,owner:owner(r)};
    ex=S.deals.find(d=>low(d.name)===low(o.name)&&low(d.account)===low(o.account));
    if(!ex||mode==='add'){const d={id:uid(),imp:batch,...o};if(d.stage===LOST())d.lossReason='Imported';S.deals.unshift(d);d.lastStage=d.stage;if(d.stage===WON()&&!S.accts.some(a=>low(a.name)===low(d.account)))wonCheck(d);add++}else if(mode==='update'){Object.entries(o).forEach(([k,v])=>{if(v!==''&&!(Array.isArray(v)&&!v.length)&&v!==0)ex[k]=v});upd++}else skip++}
   if(type==='clients'){const nm=get(r,'name');if(!nm){skip++;return}const stt=get(r,'status');o={name:nm,contact:get(r,'contact'),phone:get(r,'phone'),owner:owner(r),retainer:num(get(r,'retainer')),renewal:dt(get(r,'renewal')),status:/churn|inactive|lost|cancel/.test(low(stt))?'Churned':'Active'};
    ex=S.accts.find(a=>low(a.name)===low(nm));
    if(!ex||mode==='add'){S.accts.unshift({...mkAcct(o),imp:batch,renewal:o.renewal,status:o.status});add++}else if(mode==='update'){Object.entries(o).forEach(([k,v])=>{if(v!==''&&v!==0)ex[k]=v});upd++}else skip++}});
  S.cfg.lastImport={id:batch,type,count:add,at:new Date().toISOString()};aud('Import '+type+': '+add+' added, '+upd+' updated, '+skip+' skipped');save('leads','deals','accts','cfg');closeM();alert('Import finished: '+add+' added, '+upd+' updated, '+skip+' skipped.')},
 impUndo(){const li=S.cfg.lastImport;if(!li||!confirm('Remove the '+li.count+' '+li.type+' added by the last import? (Records you edited by hand are removed too.)'))return;const gone=S.deals.filter(d=>d.imp===li.id).map(d=>d.id);S.leads=S.leads.filter(x=>x.imp!==li.id);S.acts=S.acts.filter(x=>x.imp!==li.id);S.deals=S.deals.filter(x=>x.imp!==li.id);S.accts=S.accts.filter(x=>x.imp!==li.id&&!gone.includes(x.dealId));delete S.cfg.lastImport;aud('Undo import');save('leads','deals','accts','acts','cfg')},
 expOpen(){openModal(`<h3>⬇ Export for another CRM</h3><label>Target CRM</label><select id="exf">${Object.keys(EXP).map(k=>`<option>${k}</option>`).join('')}</select><label>Data</label><select id="exd"><option value="leads">Leads / Contacts</option><option value="deals">Deals / Opportunities</option><option value="clients">Clients / Accounts</option></select><p class="s" style="margin:6px 0">Columns follow each system's usual import headers. In their import wizard, map any column that doesn't match automatically, and create matching pipeline stages first (your stage names are exported as-is).</p><div class="acts"><button id="exg">Download CSV</button><button class="b2" data-a="close">Cancel</button></div>`);
  el('exg').onclick=()=>{const f=el('exf').value,d=el('exd').value;doDownload(`summit_${f.toLowerCase()}_${d}.csv`,csvStr(EXP[f][d]()));aud('Exported '+d+' for '+f)}},
 restoreOpen(){openModal(`<h3>♻ Restore JSON backup</h3><p class="s">Choose a backup made with “JSON backup”. This <b>replaces all current data</b> for everyone.</p><input type="file" id="rjf" accept=".json,application/json"><div class="acts"><button class="b2" data-a="close">Cancel</button></div>`);
  el('rjf').onchange=e=>{const f=e.target.files[0];if(!f)return;fileText(f,t=>{let d;try{d=JSON.parse(t)}catch(x){return alert('That file is not valid JSON.')}if(!d||!Array.isArray(d.users)||!Array.isArray(d.leads))return alert('This does not look like a Summit CRM backup.');if(!confirm('Replace ALL current data with this backup?'))return;merge(d);aud('Restored JSON backup');save();closeM()})}}
});

function webCard(){return`<div class="card"><div class="t">🌐 Website Lead Capture</div><p class="s" style="margin:6px 0">1) Paste your form service's endpoint (Formspree, a Zapier/Make webhook, etc.) and generate form code for your site. 2) When submissions arrive, paste them here to create leads and a follow-up task in one step.</p><label>Form endpoint URL</label><input id="wep" value="${esc(S.cfg.webEndpoint||'')}" placeholder="https://formspree.io/f/xxxx"><div class="acts" style="border:0;margin:0;padding:0"><button data-a="webCode">&lt;/&gt; Generate form code</button><button class="b2" data-a="webImport">📥 Import submissions</button></div></div>`}
const gv=(o,names)=>{for(const[k,v]of Object.entries(o)){if(names.includes(normH(k))&&String(v??'').trim()&&typeof v!=='object')return String(v).trim()}return''};
function parseSubs(t){t=t.trim();if(!t)return[];
 try{const j=JSON.parse(t);return(Array.isArray(j)?j:[j]).filter(x=>x&&typeof x==='object')}catch(e){}
 const first=t.split(/\r?\n/)[0];
 if(!/^[^:\n]{1,40}:\s/.test(first)&&first.includes(',')){const r=parseCSV(t);if(r.length>1){const H=r[0];return r.slice(1).map(row=>Object.fromEntries(H.map((h,i)=>[h,row[i]??''])))}}
 return t.split(/\r?\n\s*\r?\n|\r?\n-{3,}\r?\n/).map(b=>{const o={};b.split(/\r?\n/).forEach(l=>{const m=l.match(/^\s*([^:]{1,40}):\s*(.*)$/);if(m)o[m[1].trim()]=m[2].trim()});return o}).filter(o=>Object.keys(o).length)}
Object.assign(A,{
 webCode(){const ep=el('wep').value.trim();if(!/^https:\/\//i.test(ep))return alert('Enter your form service endpoint (must start with https://).');S.cfg.webEndpoint=ep;save('cfg');
  const code=`${'<'}!-- Summit Creative lead form --${'>'}
<form action="${ep}" method="POST" id="summit-lead-form">
  <input name="name" placeholder="Your name" required>
  <input name="email" type="email" placeholder="Email" required>
  <input name="phone" type="tel" placeholder="Phone">
  <input name="company" placeholder="Company">
  <select name="service"><option value="">Service interested in</option>${SRV.map(x=>`<option>${x}</option>`).join('')}</select>
  <textarea name="message" placeholder="How can we help?"></textarea>
  <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
  <input type="hidden" name="page_url"><input type="hidden" name="utm_source"><input type="hidden" name="utm_medium"><input type="hidden" name="utm_campaign">
  <p style="font-size:12px">By submitting you agree to be contacted by Summit Creative Group.</p>
  <button type="submit">Send</button>
</form>
<${'script'}>
(function(){var f=document.getElementById('summit-lead-form'),p=new URLSearchParams(location.search);
f.page_url.value=location.href;['utm_source','utm_medium','utm_campaign'].forEach(function(k){f[k].value=p.get(k)||''});})();
<\/${'script'}>`;
  openModal(`<h3>&lt;/&gt; Website form code</h3><p class="s">Paste into your site's HTML (WordPress custom HTML block, Wix/Squarespace embed, etc.). Style it to match your site. It posts to your form service, which stores or emails each submission; bring those into the CRM with “Import submissions”. Honeypot spam field and UTM tracking are included.</p><textarea id="wcd" rows="14" readonly>${esc(code)}</textarea><div class="acts"><button id="wcp">📋 Copy code</button><button class="b2" data-a="close">Close</button></div>`);
  el('wcp').onclick=()=>navigator.clipboard.writeText(el('wcd').value).then(()=>alert('Copied'),()=>{el('wcd').select()})},
 webImport(){openModal(`<h3>📥 Import website submissions</h3><p class="s">Paste submissions from your form service: notification emails (Name: …, Email: … lines, blank line between entries), a CSV export, or JSON from a webhook.</p><textarea id="wix" rows="9" placeholder="Name: Jane Smith&#10;Email: jane@acme.com&#10;Message: Need SEO help"></textarea><label>Assign new leads to</label><select id="wia"><option value="rr">Round-robin across team</option>${optU()}</select><label style="display:flex;gap:8px;text-transform:none;font-weight:400;font-size:.85rem;color:var(--tx)"><input type="checkbox" id="wif" checked style="width:auto;margin:0">Create a High-priority follow-up due in 1 hour</label><div class="acts"><button id="wig">Create leads</button><button class="b2" data-a="close">Cancel</button></div>`);
  el('wig').onclick=()=>{const subs=parseSubs(el('wix').value);if(!subs.length)return alert('No submissions found in that text.');const mode=el('wia').value,fu=el('wif').checked,batch=uid(),low=x=>String(x||'').toLowerCase();let add=0,dup=0,skip=0,n=0;
   subs.slice(0,500).forEach(o=>{const first=gv(o,['firstname']),last=gv(o,['lastname']),name=gv(o,['name','fullname','yourname','contactname'])||(first+' '+last).trim(),email=gv(o,['email','emailaddress','youremail']),company=gv(o,['company','companyname','business','organization']);
    if(!name&&!email&&!company){skip++;return}
    const msg=gv(o,['message','comments','notes','details','howcanwehelp','howcanwehelpyou','inquiry']),page=gv(o,['pageurl','page','url']),us=gv(o,['utmsource','referrer']),um=gv(o,['utmmedium']),uc=gv(o,['utmcampaign']),svs=gv(o,['service','services','interest','interestedin']);
    const ex=email&&S.leads.find(l=>low(l.email)===low(email));
    if(ex){logEv('L'+ex.id,'🌐 Submitted the web form again'+(msg?': '+msg:''));dup++;return}
    const sv=SRV.filter(x=>low(svs).includes(low(x))),x=low(us),source=/google|bing|seo|organic/.test(x)?'Google / SEO':/facebook|instagram|linkedin|tiktok|twitter|social/.test(x)?'Social':/partner/.test(x)?'Partner':/referral/.test(x)?'Referral':'Website';
    const owner=mode==='rr'?S.users[(S.leads.length+n++)%S.users.length].id:mode,notes=[msg,page&&'Page: '+page,(us||um||uc)&&'UTM: '+[us,um,uc].filter(Boolean).join(' / ')].filter(Boolean).join(' • ');
    const id=uid(),co=company||name||email;S.leads.unshift({id,imp:batch,company:co,contact:name,phone:gv(o,['phone','phonenumber','tel','telephone','mobile']),email,source,disposition:S.cfg.disps[0],value:sum(sv),services:sv,notes,owner});
    logEv('L'+id,'🌐 Website form submission'+(msg?': '+msg:''));
    if(fu){const d=new Date(Date.now()+36e5);S.acts.unshift({id:uid(),imp:batch,type:'Follow-Up',title:'Respond to web lead: '+co,client:co,owner,dt:new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16),pri:'High',done:false})}add++});
   if(add)S.cfg.lastImport={id:batch,type:'leads',count:add,at:new Date().toISOString()};aud('Web submissions: '+add+' leads, '+dup+' repeat, '+skip+' skipped');save('leads','acts','cfg');closeM();alert(add+' new lead(s) created'+(dup?', '+dup+' repeat submitter(s) logged on existing leads':'')+(skip?', '+skip+' skipped':'')+'.')}}
});
/* ===== Event delegation ===== */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a]){auditClick(t);A[t.dataset.a](t.dataset.id,t)}else if(e.target===el('modal'))closeM()});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.c;if(t.id==='who')return render();if(!c)return;const id=t.dataset.id;
 if(c==='ldisp'){S.leads.find(l=>l.id===id).disposition=t.value;logEv('L'+id,'Status → '+t.value);save('leads')}if(c==='ulevel'){S.users.find(u=>u.id===id).level=t.value;save('users');(async()=>{try{await api('/api/accounts/admin',{method:'PATCH',body:JSON.stringify({userId:id,isAdmin:t.value==='admin'})});if(t.value==='admin')alert('If they already have a login, they need to sign out and back in to see admin controls.')}catch(e){}})()}if(c==='titem'){const k=S.tasks.find(x=>x.id===id),i=k.items.find(x=>x.id===t.dataset.s);i.done=t.checked;save('tasks')}if(c==='pstat'){S.props.find(x=>x.id===id).status=t.value;save('props')}
 if(c==='lown'){S.leads.find(l=>l.id===id).owner=t.value;save('leads')}
 if(c==='step')A.step(id,t)});
document.addEventListener('input',e=>{if(e.target.dataset.c==='lq'){window._lq=e.target.value;leadPage=0;const p=e.target.selectionStart;render();const i=document.querySelector('[data-c=lq]');i.focus();i.setSelectionRange(p,p)}});
document.addEventListener('dragstart',e=>{const k=e.target.closest&&e.target.closest('[data-drag]');if(k){dragId=k.dataset.drag;e.dataTransfer.setData('text/plain',dragId)}});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.col');if(c){e.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('.col');if(c)c.classList.remove('over')});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.col');if(!c)return;e.preventDefault();const d=S.deals.find(x=>x.id===dragId);if(d){d.stage=c.dataset.stage;wonCheck(d);save('deals','accts')}});
